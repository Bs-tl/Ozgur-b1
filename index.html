<style>
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
img{max-width:100%} [hidden]{display:none!important}
:root{
  --bg:#EEF2F2; --surface:#FFFFFF; --surface-2:#F6F8F8; --ink:#15232A; --muted:#58686F; --line:#D5DEDF;
  --accent:#00747E; --accent-ink:#FFFFFF; --accent-soft:#DCEFF0;
  --u1:#0066AE; --u2:#00858F; --u3:#F2C300; --u3-ink:#2A2300;
  --ok:#1E7F46; --ok-soft:#E1F3E7; --bad:#B8322B; --bad-soft:#FBE6E3; --due:#B7791F; --due-soft:#FBF0DC;
  --der:#2356C9; --die:#C62D42; --das:#1E8A4F;
  --shadow:0 1px 2px rgba(15,35,42,.06),0 4px 16px rgba(15,35,42,.06);
  --r:14px; --r-sm:10px;
  --f-ui:"Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --bg:#0E1619; --surface:#16222A; --surface-2:#1B2931; --ink:#E4ECEE; --muted:#93A5AB; --line:#2A3A42;
  --accent:#3CB9C4; --accent-ink:#06282C; --accent-soft:#163A40;
  --u1:#4A9BE0; --u2:#3CB9C4; --u3:#F2C300;
  --ok:#57C585; --ok-soft:#173327; --bad:#F07A6F; --bad-soft:#3A1F1E; --due:#E9B04F; --due-soft:#352A16;
  --der:#7FA6FF; --die:#FF7D8F; --das:#6ED49A; --shadow:none;
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0E1619; --surface:#16222A; --surface-2:#1B2931; --ink:#E4ECEE; --muted:#93A5AB; --line:#2A3A42;
  --accent:#3CB9C4; --accent-ink:#06282C; --accent-soft:#163A40;
  --u1:#4A9BE0; --u2:#3CB9C4; --u3:#F2C300;
  --ok:#57C585; --ok-soft:#173327; --bad:#F07A6F; --bad-soft:#3A1F1E; --due:#E9B04F; --due-soft:#352A16;
  --der:#7FA6FF; --die:#FF7D8F; --das:#6ED49A; --shadow:none;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:6px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.2}
.wrap{max-width:860px;margin:0 auto;padding-inline:16px;padding-block:0 110px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{max-width:860px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{white-space:nowrap;display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:-.01em;font-size:17px;margin-right:auto;background:none;border:0;padding:0}
.brand-mark{display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);font-family:var(--f-mono);font-size:12px;font-weight:700}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:12.5px;color:var(--muted);white-space:nowrap}
.chip b{color:var(--ink);font-variant-numeric:tabular-nums}
.sync-dot{width:8px;height:8px;border-radius:50%;background:var(--muted)}
.sync-dot.synced{background:var(--ok)} .sync-dot.syncing{background:var(--due)} .sync-dot.error{background:var(--bad)}
.tabs{display:flex;gap:4px}
.tab{border:0;background:none;padding:8px 12px;border-radius:10px;color:var(--muted);font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}
.tab[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}
.tab .count{font-family:var(--f-mono);font-size:11px;background:var(--due);color:#fff;border-radius:999px;padding:0 6px;min-width:18px;text-align:center}
.bottom{display:none}
@media (max-width:720px){
  .tabs.desk{display:none}
  .top .hide-sm{display:none}
  .bottom{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));justify-content:space-around}
  .bottom .tab{flex-direction:column;gap:2px;font-size:11px;padding:6px 8px;position:relative}
  .bottom .tab svg{width:22px;height:22px}
  .bottom .tab .count{position:absolute;top:0;right:4px}
  .bottom .tab[aria-current="page"]{box-shadow:none;background:var(--accent-soft);color:var(--ink)}
}
.tab svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* generic */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted)}
.eyebrow{font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);padding:10px 16px;border-radius:12px;font-weight:650;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:44px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 40%,var(--line))}
.btn.sm{min-height:34px;padding:6px 12px;font-size:13.5px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.block{width:100%}
.say{border:1px solid var(--line);background:var(--surface-2);width:30px;height:30px;border-radius:50%;display:inline-grid;place-items:center;flex:none;padding:0;color:var(--accent);vertical-align:middle}
.say svg{width:15px;height:15px;fill:currentColor}
.say:hover{border-color:var(--accent)}
.say.playing{background:var(--accent);color:var(--accent-ink)}
.bar{height:8px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bar > i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:650;padding:2px 9px;border-radius:999px;background:var(--surface-2);color:var(--muted);border:1px solid var(--line);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.due{background:var(--due-soft);color:var(--due);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.art-der{color:var(--der);font-weight:750} .art-die{color:var(--die);font-weight:750} .art-das{color:var(--das);font-weight:750}
.empty{padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:50;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

/* home */
.hero{display:grid;grid-template-columns:1.4fr 1fr;gap:14px;margin-top:18px}
@media (max-width:720px){.hero{grid-template-columns:1fr}}
.resume h2{font-size:22px;letter-spacing:-.01em;margin:6px 0 4px}
.resume .row{margin-top:14px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;text-align:left}
.kpi .n{font-size:24px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .l{font-size:12.5px;color:var(--muted)}
.kpi.due{background:var(--due-soft);border-color:transparent}
.kpi.due .n{color:var(--due)}
button.kpi{cursor:pointer;font:inherit;color:inherit}
.nudges{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.nudge{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:var(--r-sm);border:1px dashed var(--line);background:var(--surface)}
.nudge .t{flex:1;min-width:0}
.nudge b{display:block}

/* line map */
.line{margin-top:26px}
.line-h{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.badge{font-family:var(--f-mono);font-weight:800;font-size:14px;padding:4px 9px;border-radius:7px;background:var(--line-c);color:#fff;letter-spacing:.02em}
.line.u3 .badge{color:var(--u3-ink)}
.line-h h3{font-size:18px}
.line-h .bar{flex:1;max-width:180px;margin-left:auto}
.line-h .frac{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.stations{list-style:none;margin:0;padding:6px 0 0 0;position:relative}
.stations::before{content:"";position:absolute;left:17px;top:18px;bottom:18px;width:6px;border-radius:6px;background:var(--line-c);opacity:.9}
.st > button{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;padding:8px 10px 8px 6px;border-radius:12px}
.st > button:hover{background:var(--surface)}
.dot{position:relative;z-index:1;flex:none;width:28px;height:28px;border-radius:50%;background:var(--surface);border:5px solid var(--line-c);display:grid;place-items:center;font-family:var(--f-mono);font-size:10px;font-weight:700}
.st.done .dot{background:var(--line-c)}
.st.done .dot::after{content:"";width:9px;height:5px;border-left:2.5px solid #fff;border-bottom:2.5px solid #fff;transform:rotate(-45deg) translate(1px,-1px)}
.line.u3 .st.done .dot::after{border-color:var(--u3-ink)}
.st.quiz .dot{width:34px;height:34px;margin-left:-3px;border-radius:9px;border-width:4px;background:var(--surface)}
.st.quiz.done .dot{background:var(--line-c)}
.st.next > button{background:var(--surface);box-shadow:var(--shadow);outline:2px solid var(--line-c)}
.st .nm{flex:1;min-width:0}
.st .nm b{display:block;font-weight:650}
.st .nm small{color:var(--muted);font-size:12.5px}
.st .meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.stars{font-size:12px;letter-spacing:1px;color:var(--due)}

/* player */
.player{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 120px}
.p-top{position:sticky;top:env(safe-area-inset-top,0px);z-index:25;background:var(--bg);display:flex;align-items:center;gap:12px;padding:12px 0}
.p-top .bar{flex:1}
.x{border:1px solid var(--line);background:var(--surface);width:40px;height:40px;border-radius:12px;display:grid;place-items:center;flex:none}
.x svg{width:18px;height:18px;stroke:currentColor;stroke-width:2.2;fill:none;stroke-linecap:round}
.p-count{font-family:var(--f-mono);font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.lesson-h{margin:8px 0 18px}
.lesson-h h1{font-size:26px;letter-spacing:-.015em}
.lesson-h .en{color:var(--muted);margin-top:2px}
.block{margin-bottom:16px}
.block p{margin:0}
.tr-t{font-size:15.5px}
.en-t{color:var(--muted);font-size:13.5px;font-style:italic;margin-top:6px!important}
.call{border-radius:var(--r-sm);padding:14px 16px;border:1px solid var(--line);background:var(--surface)}
.call .lab{font-family:var(--f-mono);font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;margin-bottom:4px;display:block}
.call.rule{background:var(--accent-soft);border-color:transparent}
.call.rule .lab{color:var(--accent)}
.call.tip{background:var(--due-soft);border-color:transparent}
.call.tip .lab{color:var(--due)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{background:var(--surface-2);text-align:left;font-size:12px;font-weight:700;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
tr:last-child td{border-bottom:0}
td .say{width:26px;height:26px;margin-left:6px}
td .say svg{width:12px;height:12px}
.cell-de{display:flex;align-items:flex-start;justify-content:space-between;gap:6px}
.exl{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);overflow:hidden}
.exl > div{display:flex;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line);align-items:flex-start}
.exl > div:last-child{border-bottom:0}
.exl .de{font-weight:650;font-size:15.5px}
.exl .sub{color:var(--muted);font-size:13.5px}
.dlg{border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);padding:12px}
.dlg-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.dlg-h b{font-size:14px}
.bub{display:grid;grid-template-columns:92px 1fr auto;gap:10px;padding:8px 4px;border-top:1px dashed var(--line);align-items:start}
.bub .who{font-weight:700;font-size:13px;color:var(--accent);padding-top:2px;overflow-wrap:anywhere}
.bub .de{font-weight:650}
.bub .sub{color:var(--muted);font-size:13.5px}
@media (max-width:520px){.bub{grid-template-columns:1fr auto}.bub .who{grid-column:1/-1;padding:0}}
.vgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.vitem{display:flex;gap:10px;align-items:center;padding:8px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.vitem .de{font-weight:650}
.vitem .sub{font-size:13px;color:var(--muted)}
.vitem > div{flex:1;min-width:0}
.src{font-family:var(--f-mono);font-size:11.5px;color:var(--muted)}

/* exercise */
.q{margin:14px 0 18px}
.q-type{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.q-text{font-size:21px;font-weight:700;letter-spacing:-.01em;line-height:1.35}
.q-text .blank{display:inline-block;min-width:70px;border-bottom:3px solid var(--accent);margin:0 2px;transform:translateY(-4px)}
.passage{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--u2);border-radius:var(--r-sm);padding:14px 16px;margin-bottom:14px;font-size:15.5px}
.opts{display:grid;gap:10px}
.opt{text-align:left;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 16px;font-size:16px;font-weight:550;min-height:52px;display:flex;align-items:center;gap:12px}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .k{font-family:var(--f-mono);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 6px;flex:none}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt:disabled{cursor:default}
.inp{width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:12px;padding:13px 14px;font-size:17px}
.inp:focus{outline:none;border-color:var(--accent)}
.umlauts{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.umlauts button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;min-width:38px;height:36px;font-weight:700}
.ord-ans{min-height:64px;border:1.5px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;background:var(--surface);margin-bottom:12px;align-content:flex-start}
.ord-pool{display:flex;flex-wrap:wrap;gap:8px}
.tok{border:1.5px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:650;font-size:16px}
.tok:hover{border-color:var(--accent)}
.tok.used{visibility:hidden}
.listen{display:flex;align-items:center;gap:14px;margin-bottom:16px}
.listen .big{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);border:0;display:grid;place-items:center}
.listen .big svg{width:26px;height:26px;fill:currentColor}
.fb{position:fixed;left:0;right:0;bottom:0;z-index:40;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);background:var(--surface)}
.fb-in{max-width:760px;margin:0 auto;display:flex;gap:14px;align-items:flex-end;flex-wrap:wrap}
.fb .msg{flex:1;min-width:220px}
.fb .msg b{font-size:18px;display:block}
.fb.ok{background:var(--ok-soft)} .fb.ok b{color:var(--ok)}
.fb.bad{background:var(--bad-soft)} .fb.bad b{color:var(--bad)}
.fb .ans{font-weight:700;margin-top:4px}
.fb .ex{font-size:14px;color:var(--ink);opacity:.85;margin-top:4px}
.actions{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));margin-top:20px;display:flex;gap:10px;justify-content:flex-end}
.actions .btn{box-shadow:var(--shadow)}

/* results */
.score{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.ring{--p:0;width:108px;height:108px;border-radius:50%;background:conic-gradient(var(--c,var(--accent)) calc(var(--p)*1%),var(--surface-2) 0);display:grid;place-items:center;flex:none}
.ring span{width:84px;height:84px;border-radius:50%;background:var(--surface);display:grid;place-items:center;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.mlist{display:flex;flex-direction:column;gap:10px}
.mitem{border:1px solid var(--line);border-radius:var(--r-sm);padding:12px 14px;background:var(--surface)}
.mitem .p{font-weight:650}
.mitem .yours{color:var(--bad);font-size:14px;margin-top:4px}
.mitem .yours s{opacity:.9}
.mitem .corr{color:var(--ok);font-weight:650;font-size:14.5px;margin-top:2px}
.mitem .why{color:var(--muted);font-size:13.5px;margin-top:2px}
.mitem .foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.sec-scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}

/* flashcards */
.flash{perspective:1200px;margin:10px auto 16px;max-width:520px}
.fcard{position:relative;height:260px;transition:transform .45s;transform-style:preserve-3d;cursor:pointer}
.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:18px;border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center}
.face.back{transform:rotateY(180deg)}
.face .w{font-size:28px;font-weight:800;letter-spacing:-.01em}
.face .m{font-size:22px;font-weight:700}
.face .e{color:var(--muted)}
.face .hint{position:absolute;bottom:12px;font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.fcard{transition:none}.bar > i{transition:none}}
.decks{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.deck{text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.deck:hover{border-color:var(--accent)}
.deck b{font-weight:650}
.search{position:relative}
.search .inp{padding-left:40px}
.search svg{position:absolute;left:13px;top:50%;transform:translateY(-50%);width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}
.dict{display:flex;flex-direction:column}
.dict > div{display:grid;grid-template-columns:auto 1fr 1fr auto;gap:12px;align-items:center;padding:9px 4px;border-bottom:1px solid var(--line)}
.dict .l{font-family:var(--f-mono);font-size:11px;color:var(--muted)}
@media (max-width:560px){.dict > div{grid-template-columns:1fr auto}.dict .l,.dict .en{display:none}}

/* progress */
.statgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.days{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:10px}
.days .d{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.days .d i{display:block;width:100%;max-width:26px;background:var(--accent);border-radius:5px 5px 2px 2px;min-height:2px}
.days .d i.zero{background:var(--line)}
.days .d span{font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.days .d em{font-style:normal;font-size:10.5px;font-variant-numeric:tabular-nums;color:var(--ink)}
.set{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.set:last-child{border-bottom:0}
.switch{position:relative;width:48px;height:28px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:99px;transition:.2s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:.2s}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(20px)}
.switch input:focus-visible + span{outline:2.5px solid var(--accent);outline-offset:2px}
select.inp{padding:8px 10px;font-size:15px;width:auto}
.ltable td,.ltable th{white-space:nowrap}
.ltable td:first-child{white-space:normal;min-width:180px}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 10px}
.sec-title h2{font-size:19px}
.page-h{margin:20px 0 6px}
.page-h h1{font-size:26px;letter-spacing:-.015em}
.page-h p{color:var(--muted);margin:4px 0 0}

</style>
</head>

L({ id: "b11-04", s: "B1.1", t: "Süreçler ve Passiv (bütün zamanlar)", en: "Processes and the passive",
  src: "B1.1 Ünite 4 · Master Book B1.1 §6, B1.2 §6",
  th: [
    ["p", "Eylemi kimin yaptığı önemsizse veya bilinmiyorsa Passiv kullanılır: werden + Partizip II. Süreç anlatımı, haber, talimat ve resmi metinlerde çok yaygındır.",

L({ id: "b11-05", s: "B1.1", t: "Konjunktiv II: kibarlık, tavsiye ve geçmiş pişmanlık", en: "Konjunktiv II: politeness, advice, past regrets",

L({ id: "b12-07", s: "B1.2", t: "İlişkiler, duygular ve kip ekleri", en: "Relationships, feelings and modal particles",

  th: [
    ["p", "Kip ekleri (Modalpartikeln) cümlenin anlamını değil tonunu değiştirir: şaşkınlık, sabırsızlık, samimiyet, yumuşatma. Genelde fiilden hemen sonra, vurgusuz gelir. Onları anlamak konuşma dilini anlamanın anahtarıdır.",

    ["tbl", ["Ek", "Etki", "Örnek", "TR (yaklaşık)"], [

      ${ex.expl ? `<div class="ex">${esc(ex.expl)}</div>` : ""}

  }
  return `<div class="q">${head}${passage}${prompt}</div>${area}${actions}${fbHTML}`;
}
function renderResults() {
  const s = S.session;
  const ok = s.res.filter(r => r.ok).length, n = s.res.length, p = pct(ok, n);
  const wrong = s.res.filter(r => !r.ok);
  const passLine = s.mode === "quiz" ? (p >= (s.id === "mock" ? 60 : PASS) ? `<span class="pill ok">Geçtin</span>` : `<span class="pill bad">Geçme sınırı %${s.id === "mock" ? 60 : PASS}</span>`) : "";

  }
  const l = s.mode === "lesson" ? LESSONS[LIDX[s.id]] : null;
  const next = l ? LESSONS[l.n] : null;
  const nq = l ? QUIZZES.find(q => q.after === LIDX[l.id]) : null;
  return `<div class="lesson-h"><span class="eyebrow">${s.mode === "lesson" ? "Ders tamamlandı" : s.mode === "quiz" ? "Sınav sonucu" : "Tekrar tamamlandı"}</span><h1>${esc(s.title)}</h1></div>
  <div class="card"><div class="score"><div class="ring" style="--p:${p};--c:${p >= PASS ? "var(--ok)" : p >= 50 ? "var(--due)" : "var(--bad)"}"><span>%${p}</span></div>
    <div class="stack" style="gap:6px"><div style="font-size:18px;font-weight:700">${ok} doğru, ${n - ok} yanlış</div><div class="row">${passLine}${s.mode === "lesson" ? `<span class="stars">${stars(p)}</span>` : ""}</div>
    <div class="muted">${wrong.length ? "Yanlışların Tekrar listesine eklendi. Aralıklı tekrarla 1, 3 ve 7 gün sonra tekrar sorulur; üst üste doğru bildiğinde listeden çıkar." : "Hiç yanlış yok. Böyle devam!"}</div></div></div>
    ${secHTML}
    <div class="row" style="margin-top:16px">
      ${wrong.length ? `<button class="btn primary" data-retry>Yanlışları şimdi tekrar et (${Math.min(wrong.length, 20)})</button>` : ""}
      ${nq && !quizPassed(nq) ? `<button class="btn ${wrong.length ? "" : "primary"}" data-quiz="${nq.id}">${esc(nq.t)}</button>` : ""}
      ${next ? `<button class="btn ${wrong.length || (nq && !quizPassed(nq)) ? "" : "primary"}" data-lesson="${next.id}">Sonraki ders: ${esc(next.t)}</button>` : ""}

    </div></div>
  ${wrong.length ? `<div class="sec-title"><h2>Yanlışların</h2></div><div class="mlist">${wrong.map(r => mistakeCard(r.k, r.g, null)).join("")}</div>` : ""}`;
}
function mistakeCard(k, given, m) {
  const ex = exFromKey(k); if (!ex) return "";
  const due = m ? (m.due <= Date.now() ? `<span class="pill due">tekrar zamanı</span>` : `<span class="pill">${Math.max(1, Math.ceil((m.due - Date.now()) / DAY))} gün sonra</span>`) : "";
  const lvl = m ? `<span class="pill acc">seviye ${m.box}/${INTERVALS.length}</span>` : "";
  return `<div class="mitem">${ex.passage ? `<div class="src">${esc(ex.passageTitle || "")}</div>` : ""}<div class="p">${esc(ex.type === "ls" ? `Dinleme: „${ex.hear}“ — ${ex.prompt}` : ex.prompt)}</div>
    ${given ? `<div class="yours">Senin cevabın: <s>${esc(given)}</s></div>` : `<div class="yours">Cevap verilmedi</div>`}
    <div class="corr">Doğrusu: ${esc(correctText(ex))}</div>${ex.expl ? `<div class="why">${esc(ex.expl)}</div>` : ""}
    ${m ? `<div class="foot">${due}${lvl}<span class="pill">${m.n}× yanlış</span><span class="src">${esc(ex.src || "")}</span><button class="btn sm ghost" data-forget="${esc(k)}" style="margin-left:auto">Öğrendim, listeden çıkar</button></div>` : ""}</div>`;
}

/* answer handling */
function submit(given) {
  const s = S.session, ex = curEx(); if (!ex || fb) return;
  const r = check(ex, given);
  const ctx = s.mode === "review" ? "review" : s.mode === "quiz" ? "quiz" : "learn";
  record(ex.key, r.ok, given, ctx);
  s.res[s.i] = { k: ex.key, ok: r.ok, g: given };
  if (s.mode === "quiz") { advance(); return; }
  fb = { ok: r.ok, given, note: r.note };
  s.fb = fb;
  save(); render();
  setTimeout(() => { const b = $("[data-next]"); if (b) b.focus(); }, 30);
}
function advance() {
  const s = S.session;
  fb = null; s.fb = null; ordPicked = [];
  s.i++;
  if (s.i >= s.keys.length) finishSession(); else save();
  render(); window.scrollTo(0, 0);
  autoplayListen();
}
function autoplayListen() {
  const s = S.session; if (!s || s.phase !== "ex") return;
  const ex = curEx(); if (ex && ex.type === "ls" && !fb) setTimeout(() => { const b = $(".listen .big"); if (b) speak(ex.hear, b); }, 250);
}
function currentTyped() {
  const ex = curEx();
  if (ex.type === "ord") { const toks = shuffle(ex.ans[0].split(" "), hash(ex.key) + S.session.seed); return ordPicked.map(i => toks[i]).join(" "); }
  const inp = $("[data-ans]"); return inp ? inp.value : "";
}
function afterPlayer() {
  const s = S.session;
  if (s && s.fb && !fb) fb = s.fb;
  const inp = $("[data-ans]"); if (inp && !fb) setTimeout(() => inp.focus(), 30);
}

/* ---------- WORDS ---------- */
let fcState = null; // {queue:[wordKey], i, flip}
let dictQ = "";
function viewWords() {
  if (fcState && fcState.i < fcState.queue.length) return viewFlash();
  const due = dueWords();
  const decks = LESSONS.filter(l => (l.v || []).length).map(l => {
    const ws = ALL_WORDS.filter(w => w.lid === l.id); const seen = ws.filter(w => S.vocab[w.key]).length; const known = ws.filter(w => S.vocab[w.key] && S.vocab[w.key].box >= 3).length;
    return `<button class="deck" data-deck="${l.id}"><span class="eyebrow">${esc(l.s)} · Ders ${l.n}</span><b>${esc(l.t)}</b><span class="muted" style="font-size:13px">${ws.length} kelime · ${seen} görüldü · ${known} öğrenildi</span><div class="bar"><i style="width:${pct(known, ws.length)}%"></i></div></button>`;
  }).join("");

  <div class="row">${due.length ? `<button class="btn primary" data-fc-due>Tekrar et</button>` : ""}<button class="btn" data-fc-new>Yeni kelimeler (10)</button></div></div></div>
  <div class="sec-title"><h2>Ders desteleri</h2></div><div class="decks">${decks}</div>

  <div class="search">${IC.search}<input class="inp" id="dict-q" data-dict placeholder="Almanca, Türkçe veya İngilizce ara…" value="${esc(dictQ)}" aria-label="Sözlükte ara"></div>
  <div class="dict" id="dict" style="margin-top:8px">${dictRows()}</div>`;
}
function dictRows() {
  const q = norm(dictQ);
  let rows = ALL_WORDS;
  if (q) rows = rows.filter(w => norm(w.de).includes(q) || norm(w.tr).includes(q) || norm(w.en).includes(q));
  const seen = new Set(); rows = rows.filter(w => { const k = w.de + "|" + w.tr; if (seen.has(k)) return false; seen.add(k); return true; });
  const cut = rows.slice(0, q ? 200 : 60);
  return cut.map(w => `<div><span>${artHTML(w.de)}</span><span>${esc(w.tr)}</span><span class="en muted">${esc(w.en)}</span><span class="row" style="gap:6px;flex-wrap:nowrap"><span class="l">D${LESSONS[LIDX[w.lid]].n}</span>${sayBtn(w.de.split(",")[0])}</span></div>`).join("") +
    (rows.length > cut.length ? `<div class="muted" style="grid-template-columns:1fr">+${rows.length - cut.length} kelime daha · aramayla daralt</div>` : "") + (!rows.length ? `<div class="muted" style="grid-template-columns:1fr">Sonuç yok</div>` : "");
}
function startFlash(keys) { if (!keys.length) { toast("Bu destede gösterilecek kart kalmadı."); return; } fcState = { queue: keys, i: 0, flip: false, known: 0 }; render(); }
function viewFlash() {
  const k = fcState.queue[fcState.i]; const w = ALL_WORDS.find(x => x.key === k);
  const rec = S.vocab[k];
  return `<div class="page-h row" style="justify-content:space-between"><div><h1>Kelime kartları</h1><p>${fcState.i + 1} / ${fcState.queue.length} · ${rec ? `seviye ${rec.box}` : "yeni kart"}</p></div><button class="btn ghost sm" data-fc-end>Bitir</button></div>
  <div class="bar"><i style="width:${pct(fcState.i, fcState.queue.length)}%"></i></div>
  <div class="flash"><div class="fcard ${fcState.flip ? "flip" : ""}" data-flip role="button" tabindex="0" aria-label="Kartı çevir">
    <div class="face"><span class="eyebrow">Ders ${LESSONS[LIDX[w.lid]].n}</span><div class="w">${artHTML(w.de)}</div>${sayBtn(w.de.split(",")[0])}<span class="hint">Çevirmek için dokun · boşluk</span></div>
    <div class="face back"><div class="w" style="font-size:20px">${artHTML(w.de)}</div><div class="m">${esc(w.tr)}</div><div class="e">${esc(w.en)}</div></div>
  </div></div>

}
function fcButtons() { return fcState.flip ? `<button class="btn" data-fc="0">Bilmiyorum</button><button class="btn primary" data-fc="1">Biliyorum</button>` : `<button class="btn primary" data-flip-btn>Kartı çevir</button>`; }
function toggleFlip() { if (!fcState) return; fcState.flip = !fcState.flip; const c = $(".fcard"); if (c) c.classList.toggle("flip", fcState.flip); const a = $("#fc-actions"); if (a) a.innerHTML = fcButtons(); }
function rateCard(known) {
  const k = fcState.queue[fcState.i]; const r = S.vocab[k] || { box: 0, due: 0 };
  if (known) { r.box = Math.min(r.box + 1, VINTERVALS.length - 1); r.due = Date.now() + VINTERVALS[r.box]; fcState.known++; }
  else { r.box = 0; r.due = Date.now(); if (fcState.queue.length - fcState.i < 40) fcState.queue.push(k); }
  S.vocab[k] = r; const d = today(); S.days[d] = (S.days[d] || 0) + 1;
  fcState.i++; fcState.flip = false; save();
  if (fcState.i >= fcState.queue.length) { toast(`Deste bitti · ${fcState.known} kart bildin`); fcState = null; }
  render();
}

  const d = t.dataset;
  if (d.say != null) { speak(d.say, t.classList.contains("big") ? t : t); return; }
  if (d.go) { fcState = null; go(d.go); return; }
  if (d.lesson) {
    const s = S.session;
    if (s && s.id === d.lesson && s.phase !== "done") { fb = s.fb || null; ordPicked = []; go("play"); return; }
    startLesson(d.lesson); return;
  }
  if (d.quiz) { startQuiz(d.quiz); autoplayListen(); return; }
  if (d.resume != null) { fb = (S.session && S.session.fb) || null; ordPicked = []; go("play"); autoplayListen(); return; }
  if (d.drop != null) { S.session = null; save(); render(); return; }
  if (d.exit != null) { if ("speechSynthesis" in window) speechSynthesis.cancel(); if (S.session && S.session.phase === "done") S.session = null; save(); go(view); return; }
  if (d.home != null) { S.session = null; save(); go("home"); return; }
  if (d.start != null) { S.session.phase = "ex"; S.session.i = 0; save(); render(); window.scrollTo(0, 0); autoplayListen(); return; }
  if (d.opt != null) { submit(d.opt); return; }
  if (d.check != null) { const g = currentTyped(); if (!g.trim()) { toast("Önce bir cevap yaz."); return; } submit(g); return; }
  if (d.giveup != null || d.skipq != null) { submit(""); return; }
  if (d.next != null || d.skip != null) { advance(); return; }
  if (d.ch) { const inp = $("[data-ans]"); if (inp) { const a = inp.selectionStart ?? inp.value.length, b = inp.selectionEnd ?? a; inp.value = inp.value.slice(0, a) + d.ch + inp.value.slice(b); inp.focus(); inp.setSelectionRange(a + 1, a + 1); } return; }
  if (d.pick != null) { const i = +d.pick; if (!ordPicked.includes(i)) ordPicked.push(i); render(); return; }
  if (d.unpick != null) { ordPicked.splice(+d.unpick, 1); render(); return; }
  if (d.reveal != null) { const tr = $("[data-transcript]"); if (tr) tr.hidden = false; t.remove(); return; }
  if (d.playall != null) { const box = t.closest("[data-dlg]"); const btns = $$(".say", box); let i = 0; const nxt = () => { if (i < btns.length) { const b = btns[i++]; speak(b.dataset.say, b, nxt); } }; nxt(); return; }
  if (d.retry != null) { const w = S.session.res.filter(r => !r.ok).map(r => r.k); startReview(w, "Yanlışları tekrar"); autoplayListen(); return; }
  if (d.reviewDue != null) { startReview(dueMistakes()); autoplayListen(); return; }
  if (d.reviewAll != null) { startReview(shuffle(Object.keys(S.mistakes), Date.now() % 9999), "Tüm yanlışlar · karışık"); autoplayListen(); return; }
  if (d.forget) { if (S.mistakes[d.forget]) { delete S.mistakes[d.forget]; S.stats.mastered++; save(); render(); toast("Listeden çıkarıldı"); } return; }
  if (d.rf) { revFilter = d.rf; render(); return; }
  if (d.fcDue != null) { startFlash(shuffle(dueWords().map(w => w.key), Date.now() % 9999).slice(0, 30)); return; }
  if (d.fcNew != null) { startFlash(ALL_WORDS.filter(w => !S.vocab[w.key]).slice(0, 10).map(w => w.key)); return; }
  if (d.deck) { const ws = ALL_WORDS.filter(w => w.lid === d.deck); const pri = ws.filter(w => !S.vocab[w.key] || S.vocab[w.key].due <= Date.now()); startFlash((pri.length ? pri : ws).map(w => w.key)); return; }
  if (d.flip != null || d.flipBtn != null) { toggleFlip(); return; }
  if (d.fc != null) { rateCard(d.fc === "1"); return; }
  if (d.fcEnd != null) { fcState = null; render(); return; }
  if (d.backup != null) {
    const code = btoa(unescape(encodeURIComponent(JSON.stringify(S))));
    const done = () => toast("Yedek kodu kopyalandı");
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done).catch(() => { const b = $("#restore-box"); if (b) { b.value = code; b.select(); toast("Kod kutuya yazıldı, seçip kopyala"); } });
    else { const b = $("#restore-box"); if (b) { b.value = code; b.select(); toast("Kod kutuya yazıldı, seçip kopyala"); } }
    return;
  }
  if (d.restore != null) {
    const b = $("#restore-box"); const raw = b ? b.value.trim() : "";
    if (!raw) { toast("Önce yedek kodunu yapıştır."); return; }
    try {
      let obj; try { obj = JSON.parse(decodeURIComponent(escape(atob(raw)))); } catch (e2) { obj = JSON.parse(raw); }
      if (!obj || typeof obj !== "object" || !obj.lessons) throw new Error("bad");
      S = adopt(obj); S.updatedAt = Date.now(); fb = null; fcState = null; save(); render(); toast("İlerleme geri yüklendi");
    } catch (e) { toast("Bu kod okunamadı. Tamamını kopyaladığından emin ol."); }
    return;
  }
  if (d.reset != null) { confirmReset = true; render(); return; }
  if (d.resetNo != null) { confirmReset = false; render(); return; }
  if (d.resetYes != null) { const keep = S.settings; S = blank(); S.settings = keep; confirmReset = false; fcState = null; save(); render(); toast("İlerleme sıfırlandı"); return; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.setEn != null) { S.settings.en = t.checked; save(); }
  if (t.dataset.setRate != null) { S.settings.rate = parseFloat(t.value) || 0.9; save(); }
});
document.addEventListener("keydown", e => {
  if (mode === "play" && S.session && S.session.phase === "ex") {
    if (e.key === "Enter") {
      if (fb) { e.preventDefault(); advance(); return; }
      const inp = $("[data-ans]");
      if (inp && document.activeElement === inp && inp.value.trim()) { e.preventDefault(); submit(inp.value); return; }
      const ex = curEx(); if (ex && ex.type === "ord" && ordPicked.length) { e.preventDefault(); submit(currentTyped()); return; }
    }
    if (!fb && /^[1-4]$/.test(e.key) && document.activeElement && document.activeElement.tagName !== "INPUT") {
      const b = $$(".opt")[+e.key - 1]; if (b) { e.preventDefault(); b.click(); }
    }
  }
  if (view === "words" && fcState && mode === "main") {
    if ((e.key === " " || (e.key === "Enter" && document.activeElement && document.activeElement.hasAttribute("data-flip"))) && document.activeElement.tagName !== "INPUT") { e.preventDefault(); toggleFlip(); }
    else if (fcState.flip && (e.key === "1" || e.key === "ArrowLeft")) rateCard(false);
    else if (fcState.flip && (e.key === "2" || e.key === "ArrowRight")) rateCard(true);
  }
});

/* ---------- boot ---------- */
if ("serviceWorker" in navigator && location.protocol === "https:") { window.addEventListener("load", () => fetch("sw.js", { method: "HEAD" }).then(r => { if (r.ok) navigator.serviceWorker.register("sw.js"); }).catch(() => {})); }
function start() {
  loadLocal();
  if (S.session && S.session.fb) fb = S.session.fb;
  render();
  initSync();
}
start();
})();

</script>
</body>
</html>
